<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:var(--text);border:0;border-radius:14px;padding:14px;cursor:pointer;touch-action:manipulation;transition:transform 150ms var(--out),opacity .2s;background:var(--panel)}

input[type=text]{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%;min-width:0;-webkit-user-select:text;user-select:text}
select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;width:100%}
main{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;min-height:100vh;min-height:100dvh}
h1{margin:6px 0 0;font-size:30px;line-height:1.1;text-align:center;font-family:var(--display);letter-spacing:-.02em}
h1 b{color:var(--accent)}
h2{margin:0;font-size:15px;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.sub{text-align:center;color:var(--dim);margin:0}
.panel{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.primary{background:var(--accent);color:var(--on);font-weight:700;padding:16px;font-family:var(--display)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 13px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:15px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--on);font-weight:600}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.stage.enter>*{animation:in 320ms var(--out) both}
.stage.enter>*:nth-child(2){animation-delay:70ms}.stage.enter>*:nth-child(3){animation-delay:140ms}.stage.enter>*:nth-child(4){animation-delay:210ms}
.stage.enter .big{animation:pop 520ms cubic-bezier(.34,1.56,.64,1) 120ms both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}}
.bar i{transform-origin:left;animation:grow 650ms var(--out) both;animation-delay:calc(var(--d,0)*90ms + 250ms)}
.names button{animation:in 300ms var(--out) both;animation-delay:calc(var(--d,0)*45ms)}
.panel,.primary{animation:in 300ms var(--out) both}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);padding:14px;border-radius:12px;cursor:pointer;transition:transform 150ms var(--out)}
.tog:active{transform:scale(.98)}
.tog input{width:24px;height:24px;margin:0;flex:none;accent-color:var(--accent);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);padding:0;border:0;background:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.lead{font-size:27px;font-weight:700;line-height:1.2;font-family:var(--display);letter-spacing:-.02em}
.big{font-size:42px;font-weight:800;color:var(--gold);line-height:1.1;font-family:var(--display);letter-spacing:-.02em}
.dim{color:var(--dim);font-size:15px}
.top{display:flex;justify-content:space-between;align-items:center}
.link{background:none;color:var(--dim);padding:8px 4px}

.x{background:none;padding:0 2px;color:var(--dim)}
.prow{display:flex;gap:8px;align-items:center}
.names{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.names button{padding:18px 8px;font-size:19px;font-weight:600;border:1px solid var(--line);font-family:var(--display)}
.names button:disabled{opacity:.25}
.bar{display:grid;grid-template-columns:90px 1fr 28px;gap:8px;align-items:center;text-align:left;font-size:16px}
.bar i{display:block;height:20px;border-radius:10px;background:var(--accent);min-width:4px}
.bar.win i{background:var(--gold)}
.bar.win b{color:var(--gold)}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wheel{position:relative;height:132px;margin:0 auto;width:140px}
.wheel:before{content:"";position:absolute;left:0;right:0;top:44px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--accent);pointer-events:none}
.wheel:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--panel) 0,transparent 38%,transparent 62%,var(--panel) 100%)}
.wheel ul{list-style:none;margin:0;padding:44px 0;height:100%;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;position:relative;z-index:1;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.wheel ul::-webkit-scrollbar{display:none}
.wheel li{height:44px;line-height:44px;text-align:center;font-size:22px;color:var(--dim);scroll-snap-align:center;scroll-snap-stop:always;cursor:pointer;transition:color .15s,font-size .15s}
.wheel li.sel{color:var(--text);font-weight:800;font-size:28px;font-family:var(--display)}
.how{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.how li{animation:in 300ms var(--out) both;animation-delay:calc(var(--i)*60ms)}

@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/bricolage-grotesque-latin-ext.woff2") format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--display:"Bricolage Grotesque",system-ui,sans-serif}

body{-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}

</style></head>

<script>
const KEY='mostlikelyto-v1';
const PROMPTS={

spicy:["have the most embarrassing search history","text their ex at 2 a.m.","get kicked out of a restaurant","fall for someone in the friend group","ghost a first date","have a secret second phone","lie about their age online","drunk-order food for the whole house","cheat at a board game","get a parking ticket and ignore it for a year","sneak out as a teenager and not get caught","flirt their way out of trouble","have the most unhinged group chat","go to Vegas and not remember it","be a bad influence","hold a grudge for ten years","get caught talking about someone","pretend to know about something they don't","become a villain in a movie","date two people at once","have the wildest college story","lie on a resume","start drama in the group chat","steal a roommate's food","make out at a wedding","get banned from a bar","be the first to get married","be the first to get divorced","crash someone else's party uninvited","say something way too honest at a dinner","hook up with a coworker","break a law and call it a mistake","pick a fight over something dumb","fake an injury to get out of plans","be a spy","have a secret admirer","double text three times","lose a bet and welch on it","have an OnlyFans-level confidence","get way too competitive over a card game"],
wild:["become a cult leader","get arrested for something ridiculous","fake their own death","start a business that's actually a scam","be on a reality dating show","marry for money","hide a body (and be good at it)","run away to join the circus","be abducted by aliens and enjoy it","accidentally start a viral conspiracy","become a supervillain","go to jail for a crime they didn't commit","survive on a deserted island the longest","get stuck in a witness-protection program","end up on the news","win the lottery and lose it all in a year","sell their soul for fame","time-travel and ruin history","be a secret billionaire","have an evil twin","start a riot at a concert","become president","be the last person on Earth","get possessed by a ghost","run for mayor as a joke and win","get chased by a goose","join a pyramid scheme","dress as a mascot and refuse to leave the costume","build a bunker in their backyard","become a conspiracy theorist"]};
const THEMES=['default','ocean','forest','sunset','grape','mono','light'];
const def={players:['','',''],cats:{mild:true,spicy:true,wild:true},theme:'default',self:false,rounds:15,sound:true,vibe:true,vol:.6,play:'pass'};
let S;try{S=Object.assign({},def,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=Object.assign({},def)}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
// ---- party sound kit: the SAME block in all five games (Imposter, Would You Rather, She's a 10, Most Likely To, Hot Take). Change one, change all.
let ac;
function ensureAudio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}}
function tone(f,d,{type='sine',vol=1,slide=0,delay=0}={}){if(!S.sound||!ac)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol*S.vol*.35,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,f0,f1,vol=1,delay=0){if(!S.sound||!ac)return;const t=ac.currentTime+delay,n=ac.sampleRate*d|0,buf=ac.createBuffer(1,n,ac.sampleRate),x=buf.getChannelData(0);for(let i=0;i<n;i++)x[i]=Math.random()*2-1;const src=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();src.buffer=buf;fl.type='bandpass';fl.Q.value=1.2;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol*S.vol*.35,t+d*.6);g.gain.exponentialRampToValueAtTime(.0001,t+d);src.connect(fl);fl.connect(g);g.connect(ac.destination);src.start(t)}
const bell=(f,delay=0,len=1)=>{tone(f,.9*len,{vol:.8,delay});tone(f*2.76,.5*len,{vol:.22,delay})};
let tapT;const named=fn=>(...a)=>{clearTimeout(tapT);fn(...a)}; // a named sound cancels the pending generic tap blip
const sfx={
 tap:()=>tone(1200,.04,{vol:.5}), // any button
 tick:()=>tone(900,.03,{type:'square',vol:.3}), // scroll wheel, slider, countdown
 start:named(()=>{bell(784,0,.8);bell(988,.12,.8)}), // game begins
 card:named(()=>{noise(.25,400,2600,1.4);bell(659.25,.16)}), // new card / pass the phone
 hide:named(()=>{tone(660,.12,{vol:.6});tone(494,.18,{vol:.6,delay:.1})}),
 lock:named(()=>[523.25,659.25,783.99].forEach((f,i)=>tone(f,.25,{vol:.7,delay:i*.08}))), // vote or answer locked in
 reveal:named(()=>{noise(.3,300,3000,2.2);bell(880,.22)}),
 win:named(()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>bell(f,i*.09,.8))),
 close:named(()=>{bell(784,0,.8);bell(988,.12,.8)}),
 miss:named(()=>tone(220,.45,{type:'triangle',vol:1.2,slide:110})),
 ding:named(()=>bell(1320,0,1.4)), // timer up
 final:named(()=>{noise(.9,200,2500,2.4);tone(110,.5,{type:'triangle',vol:1.4,slide:55,delay:.9})}), // big drum-roll reveal
 dot:i=>tone(600+i*90,.12,{vol:.5,delay:.25+i*.11})
};
// vibration strengths (ms), used by name everywhere
const BUZZ={tap:12,tick:8,select:15,card:15,lock:30,reveal:40,close:[50,40,50],win:[60,40,60,40,120],miss:200,alarm:[300,100,300,100,300]};
function buzz(p){try{if(S.vibe&&navigator.vibrate)navigator.vibrate(p)}catch(e){}} // Android only, iOS ignores it
document.addEventListener('click',e=>{if(!e.target.closest('button,input[type=checkbox],select,summary,.more-games a'))return;ensureAudio();buzz(BUZZ.tap);tapT=setTimeout(sfx.tap,0)},true); // every tap: blip + light buzz
// ---- end sound kit
const $=s=>document.querySelector(s);const app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const applyTheme=()=>document.documentElement.dataset.theme=S.theme==='default'?'':S.theme;
function tally(votes,players){const t=players.map(()=>0);votes.forEach(v=>{if(v>=0)t[v]++});return t}
function winners(t){const m=Math.max(...t);return m>0?t.map((n,i)=>n===m?i:-1).filter(i=>i>=0):[]}
function wheel(el,vals,cur,fn){el.innerHTML='<ul tabindex=0 aria-label="Number of rounds">'+vals.map(n=>`<li data-v=${n}>${n}</li>`).join('')+'</ul>';
const ul=el.firstChild,H=44;let idx=Math.max(0,vals.indexOf(cur));
const mark=()=>[...ul.children].forEach((li,i)=>li.classList.toggle('sel',i===idx));
ul.scrollTop=idx*H;mark();
ul.onscroll=()=>{const i=Math.max(0,Math.min(vals.length-1,Math.round(ul.scrollTop/H)));if(i!==idx){idx=i;mark();sfx.tick();buzz(BUZZ.tick);fn(vals[i])}};
ul.onclick=e=>{const li=e.target.closest('li');if(li)ul.scrollTo({top:[...ul.children].indexOf(li)*H,behavior:'smooth'})};
ul.onkeydown=e=>{const d=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;if(d){e.preventDefault();ul.scrollTo({top:Math.max(0,Math.min(vals.length-1,idx+d))*H,behavior:'smooth'})}}}
let G=null;
function home(){applyTheme();G=null;
app.innerHTML=`<div class=top><button class=link id=how><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg> How to Play</button><button class=link id=set><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg> Settings</button></div>
<h1>Most Likely <b>To...</b></h1><p class=sub id=sb></p>
<div class=panel><h2>Game mode</h2><div class=row><button class=chip data-g=pass>Pass &amp; vote</button><button class=chip data-g=talk>Discuss</button></div><div class=dim id=gd></div></div>

<details class="more-games"><summary>More games</summary><a href="https://infinityxxxxx.github.io/imposter/">Imposter</a><a href="https://infinityxxxxx.github.io/would-you-rather/">Would You Rather</a><a href="https://infinityxxxxx.github.io/shes-a-10-but/">She's a 10, but...</a><a href="https://infinityxxxxx.github.io/hot-take-spectrum/">Hot Take Spectrum</a></details>`;
const pl=$('#pl');const draw=()=>{pl.innerHTML=S.players.map((p,i)=>`<div class=prow style="margin-bottom:8px"><input type=text maxlength=14 placeholder="Player ${i+1}" value="${esc(p)}" data-i=${i}><button class=x data-r=${i} aria-label="Remove"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div>`).join('');
pl.querySelectorAll('input').forEach(e=>e.oninput=()=>{S.players[e.dataset.i]=e.value;save();chk()});

draw();$('#add').onclick=()=>{S.players.push('');save();draw();pl.querySelectorAll('input')[S.players.length-1].focus()};
$('#cats').innerHTML=['mild','spicy','wild'].map(c=>`<button class=chip data-c=${c} aria-pressed=${S.cats[c]}>${c[0].toUpperCase()+c.slice(1)}</button>`).join('');
document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cats[b.dataset.c]=!S.cats[b.dataset.c];b.setAttribute('aria-pressed',S.cats[b.dataset.c]);save();chk()});
wheel($('#rd'),Array.from({length:48},(_,i)=>i+3),S.rounds,n=>{S.rounds=n;save()});
const gdraw=()=>{const t=S.play==='talk';document.querySelectorAll('[data-g]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.g===S.play));$('#pp').hidden=t;$('#gd').textContent=t?"Just questions on screen for the whole group.":"Everyone votes in secret on one phone.";$('#sb').textContent=t?"Big group? Read it out and talk it over. No names, no passing.":"One shared phone. Everyone votes in secret, then the group is exposed.";chk()};
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.play=b.dataset.g;save();gdraw()});
$('#how').onclick=howto;$('#set').onclick=settings;$('#go').onclick=start;gdraw()}
function howto(){app.innerHTML=`<div class=top><button class=link id=bk>← Back</button><span></span></div><h1>How to Play</h1>
<div class=panel><ol class=how>${["Add 3 to 12 players and pick your prompt types and number of rounds.","Each round, a prompt like \"Who's most likely to...\" appears. Read it out loud.","Pass the phone around. Each player taps the name they think fits best, in secret.","After the last vote, the results show who got the most votes. That player scores a point.","Ties give a point to everyone tied.","Play all the rounds. The player with the most points at the end is the most \"likely to\" overall.","Tip: turn on voting for yourself in Settings if you want it.","Big group? Pick Discuss mode: no names or passing the phone. Read each question out, talk it over, then tap Next."].map((x,i)=>`<li style="--i:${i}">${x}</li>`).join('')}</ol></div><button class=primary id=bk2>Got it</button>`;
$('#bk').onclick=home;$('#bk2').onclick=home}
function settings(){app.innerHTML=`<div class=top><button class=link id=bk>← Back</button><span></span></div><h1>Settings</h1>
<div class=panel><h2>Color theme</h2><div class=row>${THEMES.map(t=>`<button class=chip data-t=${t} aria-pressed=${S.theme===t}>${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
<div class=panel><h2>Feedback</h2><label class=tog><span>Sound effects</span><input type=checkbox id=snd ${S.sound?'checked':''}></label><label class=tog><span>Vibration (Android only)</span><input type=checkbox id=vib ${S.vibe?'checked':''}></label><h2>Volume</h2><input type=range id=vol min=.1 max=1 step=.05 value=${S.vol} aria-label=Volume></div>
<div class=panel><h2>Voting</h2><button class=chip id=sf aria-pressed=${S.self}>Allow voting for yourself: ${S.self?'on':'off'}</button></div>`;
$('#bk').onclick=home;document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.t;save();applyTheme();settings()});
$('#sf').onclick=()=>{S.self=!S.self;save();settings()};
$('#snd').onchange=e=>{S.sound=e.target.checked;save();ensureAudio();sfx.tick()};$('#vib').onchange=e=>{S.vibe=e.target.checked;save();buzz(BUZZ.lock)};$('#vol').oninput=e=>{S.vol=+e.target.value};$('#vol').onchange=()=>{save();ensureAudio();sfx.tick()}}
function start(){ensureAudio();sfx.start();buzz(BUZZ.lock);const players=S.players.map((s,i)=>s.trim()||"Player "+(i+1));
let pool=[];for(const c of Object.keys(S.cats))if(S.cats[c])pool=pool.concat(PROMPTS[c]);
pool=shuffle(pool).slice(0,Math.min(S.rounds,pool.length));
G={players,pool,i:0,voter:0,votes:[],score:players.map(()=>0)};G.talk=S.play==='talk';G.talk?talk():prompt_()}
function scoreBar(){return `<div class=score>${G.players.map((p,i)=>`<span>${esc(p)} ${G.score[i]}</span>`).join('')}</div>`}
function topBar(){return `<div class=top><span class=dim>Round ${G.i+1} / ${G.pool.length}</span><button class=link id=quit>End game</button></div>`}
function hookQuit(){const q=$('#quit');if(q)q.onclick=()=>{if(confirm('End the game?'))final()}}
function prompt_(){G.voter=0;G.votes=[];
app.innerHTML=`${topBar()}<div class="stage enter"><div class=dim>Who's most likely to...</div><div class=lead>${esc(G.pool[G.i])}?</div><p class=dim>Pass the phone. Vote in secret.</p></div><button class=primary id=nx>Start voting</button>${scoreBar()}`;hookQuit();$('#nx').onclick=()=>{sfx.card();buzz(BUZZ.card);ballot()}}
function ballot(){const p=G.players[G.voter];
app.innerHTML=`${topBar()}<div class="stage enter"><div class=dim>Most likely to...</div><div class=lead>${esc(G.pool[G.i])}?</div><div class=dim>${esc(p)}, tap your pick</div></div>
<div class=names>${G.players.map((n,i)=>`<button style=--d:${i} data-v=${i} ${!S.self&&i===G.voter?'disabled':''}>${esc(n)}</button>`).join('')}</div><p class=dim style="text-align:center">Voter ${G.voter+1} of ${G.players.length}</p>`;hookQuit();
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{sfx.lock();buzz(BUZZ.lock);G.votes.push(+b.dataset.v);G.voter++;G.voter<G.players.length?handoff():reveal()})}
function handoff(){app.innerHTML=`${topBar()}<div class="stage enter"><div class=dim>Vote locked in. Pass the phone to</div><div class=big>${esc(G.players[G.voter])}</div></div><button class=primary id=nx>I'm ${esc(G.players[G.voter])}, show me</button>`;hookQuit();$('#nx').onclick=ballot}
function reveal(){const t=tally(G.votes,G.players),w=winners(t);w.forEach(i=>G.score[i]++);
const order=t.map((n,i)=>i).sort((a,b)=>t[b]-t[a]);const mx=Math.max(1,...t);
const who=w.length===1?`${esc(G.players[w[0]])} it is!`:`${w.map(i=>esc(G.players[i])).join(' & ')} tied!`;
app.innerHTML=`${topBar()}<div class="stage enter"><div class=dim>Most likely to ${esc(G.pool[G.i])}</div><div class=big>${who}</div>
<div class=panel>${order.map(i=>`<div class="bar ${w.includes(i)?'win':''}"><span>${esc(G.players[i])}</span><i style="width:${t[i]/mx*100}%;--d:${order.indexOf(i)}"></i><b>${t[i]}</b></div>`).join('')}</div></div>
<button class=primary id=nx>${G.i+1<G.pool.length?'Next prompt':'Final results'}</button>${scoreBar()}`;hookQuit();sfx.reveal();buzz(BUZZ.reveal);
$('#nx').onclick=()=>{if(G.i+1<G.pool.length){G.i++;prompt_()}else final()}}
// discuss mode: prompts only, no players, votes or scores
function talk(){const more=G.i+1<G.pool.length;
app.innerHTML=`<div class=top><span class=dim>Question ${G.i+1} / ${G.pool.length}</span><button class=link id=quit>End game</button></div><div class="stage enter"><div class=dim>Who's most likely to...</div><div class=lead>${esc(G.pool[G.i])}?</div><p class=dim>Talk it out. Who is it, and why?</p></div><button class=primary id=nx>${more?'Next question':'Finish'}</button>`;
hookQuit();$('#nx').onclick=()=>{if(more){G.i++;sfx.card();buzz(BUZZ.card);talk()}else final()}}
function talkEnd(){const n=G.i+1;
app.innerHTML=`<h1>Game over</h1><div class="stage enter"><div class=dim>That's a wrap</div><div class=big>Good talk!</div><p class=dim>${n} question${n===1?'':'s'} discussed</p></div><button class=primary id=ag>Play again</button><button id=hm>Home</button><details class="more-games"><summary>More games</summary><a href="https://infinityxxxxx.github.io/imposter/">Imposter</a><a href="https://infinityxxxxx.github.io/would-you-rather/">Would You Rather</a><a href="https://infinityxxxxx.github.io/shes-a-10-but/">She's a 10, but...</a><a href="https://infinityxxxxx.github.io/hot-take-spectrum/">Hot Take Spectrum</a></details>`;
sfx.win();buzz(BUZZ.win);$('#ag').onclick=start;$('#hm').onclick=home}
function final(){if(G.talk)return talkEnd();
const m=Math.max(...G.score);const order=G.score.map((n,i)=>i).sort((a,b)=>G.score[b]-G.score[a]);
const w=G.score.map((n,i)=>n===m&&m>0?i:-1).filter(i=>i>=0);
app.innerHTML=`<h1>Game over</h1><div class="stage enter"><div class=dim>Most "likely to" overall</div><div class=big>${w.length?w.map(i=>esc(G.players[i])).join(' & '):'Nobody!'}</div>
<div class=panel>${order.map(i=>`<div class="bar ${w.includes(i)?'win':''}"><span>${esc(G.players[i])}</span><i style="width:${m?G.score[i]/m*100:0}%;--d:${order.indexOf(i)}"></i><b>${G.score[i]}</b></div>`).join('')}</div></div>
<button class=primary id=ag>Play again</button><button id=hm>Home</button><details class="more-games"><summary>More games</summary><a href="https://infinityxxxxx.github.io/imposter/">Imposter</a><a href="https://infinityxxxxx.github.io/would-you-rather/">Would You Rather</a><a href="https://infinityxxxxx.github.io/shes-a-10-but/">She's a 10, but...</a><a href="https://infinityxxxxx.github.io/hot-take-spectrum/">Hot Take Spectrum</a></details>`;
sfx.win();buzz(BUZZ.win);$('#ag').onclick=start;$('#hm').onclick=home}
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script></body></html>
